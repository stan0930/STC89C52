<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #102a43; }
      .h2 { font: 700 19px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #102a43; }
      .body { font: 16px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #243b53; }
      .small { font: 14px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #486581; }
      .mono { font: 15px Consolas, "Courier New", monospace; fill: #243b53; }
      .label { font: 700 14px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #102a43; }
      .page { fill: #e6f6ff; stroke: #2680c2; stroke-width: 2; }
      .chunk { fill: #d3f9d8; stroke: #2f9e44; stroke-width: 1.5; }
      .chunk2 { fill: #ffe3e3; stroke: #e03131; stroke-width: 1.5; }
      .panel { fill: #f7f9fc; stroke: #bcccdc; stroke-width: 1.5; }
      .arrow { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="52" class="title">SSD1315 水平寻址清屏示意图</text>
  <text x="48" y="82" class="body">每次 Int_OLED_WriteDataBytes(data_bytes, 8) 写入 8 个连续列，地址自动递增。</text>
  <rect x="48" y="112" width="1104" height="118" rx="12" class="panel"/>
  <text x="72" y="145" class="h2">寻址模式设置</text>
  <text x="72" y="177" class="mono">0x20, 0x00    → 水平寻址</text>
  <text x="430" y="177" class="mono">0x21, 0x00, 0x7F    → 列 0～127</text>
  <text x="850" y="177" class="mono">0x22, 0x00, 0x07    → 页 0～7</text>
  <text x="72" y="207" class="small">列地址从左到右递增；列 127 后自动进入下一页的列 0。</text>
  <text x="48" y="275" class="h2">显存布局：128 列 × 8 页 = 1024 字节</text>
  <rect x="48" y="300" width="1104" height="170" rx="10" class="panel"/>
  <rect x="80" y="330" width="1040" height="44" rx="5" class="page"/>
  <text x="92" y="358" class="label">Page 0</text>
  <rect x="190" y="330" width="116" height="44" class="chunk"/>
  <rect x="306" y="330" width="116" height="44" class="chunk2"/>
  <rect x="422" y="330" width="116" height="44" class="chunk"/>
  <rect x="538" y="330" width="116" height="44" class="chunk2"/>
  <rect x="654" y="330" width="116" height="44" class="chunk"/>
  <rect x="770" y="330" width="116" height="44" class="chunk2"/>
  <rect x="886" y="330" width="116" height="44" class="chunk"/>
  <rect x="1002" y="330" width="118" height="44" class="chunk2"/>
  <text x="205" y="358" class="label">调用 1</text>
  <text x="321" y="358" class="label">调用 2</text>
  <text x="437" y="358" class="label">调用 3</text>
  <text x="553" y="358" class="label">…</text>
  <text x="669" y="358" class="label">调用 14</text>
  <text x="785" y="358" class="label">调用 15</text>
  <text x="901" y="358" class="label">调用 16</text>
  <text x="1017" y="358" class="label">更多</text>
  <text x="190" y="401" class="small">列 0～7</text>
  <text x="306" y="401" class="small">列 8～15</text>
  <text x="886" y="401" class="small">列 120～127</text>
  <text x="92" y="445" class="small">Page 1～Page 7 的布局相同；每页有 128 个字节。</text>
  <path d="M 248 475 L 248 520" class="arrow"/>
  <path d="M 364 475 L 364 520" class="arrow"/>
  <path d="M 944 475 L 944 520" class="arrow"/>
  <text x="268" y="507" class="small">8 字节</text>
  <text x="384" y="507" class="small">8 字节</text>
  <text x="964" y="507" class="small">8 字节</text>
  <rect x="48" y="540" width="520" height="160" rx="10" class="panel"/>
  <text x="72" y="574" class="h2">调用次数对应的位置</text>
  <text x="72" y="610" class="mono">第 1 次  → Page 0, Column 0～7</text>
  <text x="72" y="638" class="mono">第 2 次  → Page 0, Column 8～15</text>
  <text x="72" y="666" class="mono">第 16 次 → Page 0, Column 120～127</text>
  <text x="72" y="694" class="mono">第 17 次 → Page 1, Column 0～7</text>
  <rect x="600" y="540" width="552" height="160" rx="10" class="panel"/>
  <text x="624" y="574" class="h2">第 128 次结束</text>
  <text x="624" y="610" class="mono">第 128 次 → Page 7, Column 120～127</text>
  <text x="624" y="644" class="body">总字节数 = 128 次 × 8 字节</text>
  <text x="624" y="674" class="body">           = 1024 字节</text>
  <text x="624" y="697" class="small">覆盖完整 128×64 显存。</text>
  <text x="48" y="735" class="small">注意：一个显存字节对应同一列的垂直 8 个像素位（D0～D7），一页不是 8 个像素行。</text>
</svg>
